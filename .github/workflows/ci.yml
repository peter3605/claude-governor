name: ci

# push only: a pull_request trigger would double every run, and check runs land on the
# head SHA either way, so a PR shows these same results.
on:
  push:

# A new push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      # -race, not a plain `go test`: this repo's central invariant is a concurrency one —
      # the lease table must never grant past the budget — and a COUNT assertion cannot see
      # a data race. It lives on THIS job rather than the darwin one because macOS runner
      # minutes bill at roughly ten times Linux.
      #
      # Do NOT add CGO_ENABLED=0 here to match the linux entries in the build matrix. Those
      # are 0 deliberately, to keep the shipped binary static; copying that onto this job
      # breaks the flag outright with `-race requires cgo`. Unset resolves to 1 here,
      # because the runner has gcc.
      - run: go test -race ./...

  # A GitHub runner is not a clean machine: it carries a Go toolchain, a checkout and a warm
  # HOME, and the install bugs worth catching live in the difference between that and a
  # stranger's laptop — a stale binary on PATH, an existing settings.json, a daemon already
  # running. So this runs the REAL install.sh in a container that has none of them.
  #
  # Linux only, and that is two decisions rather than one. macOS runner minutes bill at ~10x
  # here, and there is no such thing as a macOS container: the clean-macOS install is a
  # hardware test and stays with GOV-19.
  #
  # BOTH LIBCS, because the shipped linux binaries are CGO_ENABLED=0 and "static" is a claim
  # worth checking rather than asserting. debian is glibc with coreutils; alpine is musl with
  # busybox, whose `find` lacks -printf and whose wget is built in — both of which the script
  # had to be corrected for.
  clean-install:
    name: clean install (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:stable-slim', 'alpine:3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      # The script builds both linux artefacts from this working tree and serves them over
      # TLS, so what is installed is THIS commit rather than the last release. It is a script
      # rather than inline YAML so it can be run locally, which is where an install bug is
      # cheapest to find.
      - name: install, doctor, reinstall, uninstall byte-identical
        run: bash scripts/clean-install-test.sh '${{ matrix.image }}'

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin builds keep cgo on: the thermal shim (GOV-13) reads
          # ProcessInfo.thermalState through cgo, so this must not be locked off.
          - { runner: macos-latest, goos: darwin, goarch: arm64, cgo: '1' }
          - { runner: macos-latest, goos: darwin, goarch: amd64, cgo: '1' }
          # linux has no thermal API and needs no cgo, which keeps the binary static.
          - { runner: ubuntu-latest, goos: linux, goarch: arm64, cgo: '0' }
          - { runner: ubuntu-latest, goos: linux, goarch: amd64, cgo: '0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: go build -o bin/governor-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/governor
      # The "vet and test" job runs on ubuntu, so its `go test` exercises the no-cgo
      # fallback and the thermal shim is never executed there — only compiled here. This
      # step runs the suite once on the native macOS arch, where cgo is on and
      # ProcessInfo.thermalState is real, so a shim that builds but returns nothing is
      # caught. Native arm64 only: the amd64 job cross-compiles and cannot run its output.
      - name: test (native, cgo on — exercises the thermal shim)
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        env:
          CGO_ENABLED: '1'
        run: go test ./...
      - uses: actions/upload-artifact@v4
        with:
          name: governor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/governor-${{ matrix.goos }}-${{ matrix.goarch }}
